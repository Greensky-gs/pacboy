name: Create doc and send webhook

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  documentation:
    runs-on: docker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt update
          apt-get install -y curl git wget tar doxygen graphviz jq

      - name: Generate documentation
        env:
          PROJECT_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          test -d src
          rm -rf documentation
          mkdir -p documentation

          cat > Doxyfile <<EOF
          PROJECT_NAME           = "${PROJECT_NAME##*/}"
          PROJECT_BRIEF          = "Automatically generated Doxygen documentation"
          INPUT                  = src
          RECURSIVE              = YES
          FILE_PATTERNS          = *.c *.cc *.cpp *.cxx *.h *.hh *.hpp *.hxx *.py *.java *.cs *.php *.md
          EXTRACT_ALL            = YES
          EXTRACT_PRIVATE        = YES
          EXTRACT_STATIC         = YES
          OUTPUT_DIRECTORY       = documentation
          GENERATE_HTML          = YES
          HTML_OUTPUT            = html
          GENERATE_LATEX         = YES
          GENERATE_XML           = YES
          QUIET                  = YES
          WARNINGS               = YES
          EOF

          doxygen Doxyfile

          test -f documentation/html/index.html

      - name: Archive documentation and prepare description
        id: documentation
        shell: bash
        env:
          REPO_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          test -d documentation/html
          test -s documentation/html/index.html

          DOC_FILE="$(realpath documentation.tar.gz)"

          cd documentation
          tar -czf "$DOC_FILE" .
          cd ..

          FILE_COUNT="$(find documentation/html -type f | wc -l)"
          UNCOMPRESSED_SIZE="$(du -sh documentation/html | cut -f1)"
          ARCHIVE_SIZE="$(du -sh documentation.tar.gz | cut -f1)"
          COMPILED_AT="$(date -u +'%d/%m/%Y %H:%M:%S UTC')"

          cat > discord-description.md <<EOF
          Doxygen documentation for [**${REPO_NAME}**](${REPO_URL}) was generated successfully

          - **Compiled :** \`${COMPILED_AT}\`
          - **Documented files :** \`${FILE_COUNT}\`
          - **Uncompressed size :** \`${UNCOMPRESSED_SIZE}\`
          - **Archive size :** \`${ARCHIVE_SIZE}\`
          EOF

          {
            echo "doc_file=$DOC_FILE"
            echo "repo_name=$REPO_NAME"
          } >> "$GITHUB_OUTPUT"

          echo '--- discord-description.md ---'
          cat discord-description.md
          echo '------------------------------'

      - name: Send discord webhook
        uses: ./.forgejo/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Logo from https://www.flaticon.com/free-icons/open-book
          bot_avatar_url: "https://git.greensky.tf/Greensky/assets/raw/commit/1745b18f7115e22905923ac5937ccd2d1ab00be0/icons/wiki-magic.png"
          bot_name: '[DOC] ${{ github.repository }}'
          color: '3447003'
          title: 'Documentation generated'
          title_url: '${{ github.server_url }}/${{ github.repository }}'
          description_file: discord-description.md
          attachment_file: documentation.tar.gz
          attachment_name: documentation.tar.gz
          footer_text: 'Forgejo Actions'
          footer_icon_url: 'https://git.greensky.tf/Greensky/assets/raw/commit/1745b18f7115e22905923ac5937ccd2d1ab00be0/logos/forgejo/logo.png'
