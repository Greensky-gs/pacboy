name: Create doc, publish it to wiki and send webhook

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  documentation:
    runs-on: docker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail

          apt-get update
          apt-get install -y --no-install-recommends \
            doxygen \
            graphviz \
            git \
            curl \
            ca-certificates \
            jq

          # Install Node.js if the runner image does not provide it.
          if ! command -v node >/dev/null 2>&1; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y --no-install-recommends nodejs
          fi

          node --version
          npm --version

      - name: Generate Doxygen documentation
        env:
          PROJECT_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          test -d src

          rm -rf documentation
          mkdir -p documentation

          cat > Doxyfile <<EOF
          PROJECT_NAME           = "${PROJECT_NAME##*/}"
          PROJECT_BRIEF          = "Automatically generated Doxygen documentation"
          INPUT                  = src
          RECURSIVE              = YES
          FILE_PATTERNS          = *.c *.cc *.cpp *.cxx *.h *.hh *.hpp *.hxx *.py *.java *.cs *.php *.md
          EXTRACT_ALL            = YES
          EXTRACT_PRIVATE        = YES
          EXTRACT_STATIC         = YES
          OUTPUT_DIRECTORY       = documentation
          GENERATE_HTML          = YES
          HTML_OUTPUT            = html
          GENERATE_LATEX         = YES
          GENERATE_XML           = YES
          XML_OUTPUT             = xml
          QUIET                  = YES
          WARNINGS               = YES
          EOF

          doxygen Doxyfile

          test -f documentation/html/index.html
          test -f documentation/xml/index.xml

      - name: Convert Doxygen XML to Markdown
        id: moxygen
        run: |
          set -euo pipefail

          test -f documentation/xml/index.xml

          rm -rf wiki-generated
          mkdir -p wiki-generated

          npx --yes moxygen \
            --anchors \
            --language cpp \
            --output wiki-generated/api.md \
            documentation/xml

          test -n "$(find wiki-generated -maxdepth 1 -type f -name '*.md' -print -quit)"

      - name: Create wiki index
        run: |
          set -euo pipefail

          cat > wiki-generated/Home.md <<EOF
          # API documentation

          This documentation is generated automatically by Forgejo Actions from the
          Doxygen comments in the \`src\` directory.

          ## Reference

          EOF

          # Add links for every generated Markdown page except Home.md.
          find wiki-generated -maxdepth 1 -type f -name '*.md' ! -name 'Home.md' -printf '%f\n' \
            | sort \
            | while read -r file; do
                title="${file%.md}"
                printf -- '- [%s](%s)\n' "$title" "$file" >> wiki-generated/Home.md
              done

          cat wiki-generated/Home.md

      - name: Archive documentation and prepare description
        id: documentation
        shell: bash
        env:
          REPO_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          test -d documentation/html
          test -d documentation/xml
          test -s documentation/html/index.html
          test -n "$(find wiki-generated -maxdepth 1 -type f -name '*.md' -print -quit)"

          DOC_FILE="$(realpath documentation.tar.gz)"
          WIKI_DIR="$(realpath wiki-generated)"

          tar -czf "$DOC_FILE" -C documentation .

          FILE_COUNT="$(find documentation/html -type f | wc -l)"
          UNCOMPRESSED_SIZE="$(du -sh documentation/html | cut -f1)"
          ARCHIVE_SIZE="$(du -sh documentation.tar.gz | cut -f1)"
          COMPILED_AT="$(date -u +'%d/%m/%Y %H:%M:%S UTC')"

          cat > discord-description.md <<EOF
          Doxygen documentation for [**${REPO_NAME}**](${REPO_URL}) was generated successfully

          - **Compiled :** \`${COMPILED_AT}\`
          - **Documented files :** \`${FILE_COUNT}\`
          - **Uncompressed size :** \`${UNCOMPRESSED_SIZE}\`
          - **Archive size :** \`${ARCHIVE_SIZE}\`

          Consult wiki at [**${REPO_NAME}**](${REPO_URL})
          EOF

          {
            echo "doc_file=$DOC_FILE"
            echo "repo_name=$REPO_NAME"
            echo "wiki_dir=$WIKI_DIR"
          } >> "$GITHUB_OUTPUT"

          echo '--- discord-description.md ---'
          cat discord-description.md
          echo '------------------------------'

      - name: Push documentation to wiki
        id: pushwiki
        env:
          WIKI_TOKEN: ${{ secrets.WRITE_REPO_TOKEN }}
          WIKI_USERNAME: ${{ secrets.WRITE_REPO_USERNAME }}
          WIKI_DIR: ${{ steps.documentation.outputs.wiki_dir }}
          SERVER_URL: ${{ github.server_url }}
          REPO_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          ROOT="$(pwd)"
          WIKI_URL="$SERVER_URL/$REPO_NAME.wiki.git"
          AUTH_HEADER="Authorization: Basic $(printf '%s' "$WIKI_USERNAME:$WIKI_TOKEN" | base64 | tr -d '\n')"

          rm -rf wiki
          if git clone "$WIKI_URL" wiki; then
            echo "Wiki cloné."
          else
            echo "::warning::Impossible de cloner le wiki ; initialisation d'un dépôt local."
            mkdir wiki
            git -C wiki init
            git -C wiki checkout -b main

            cat > wiki/Home.md <<'EOF'
          # Wiki

          Wiki initialisé automatiquement.
          EOF
          fi

          find wiki -maxdepth 1 -type f -name 'api-*.md' -delete
          find wiki -maxdepth 1 -type f -name 'api.md' -delete

          cp -v "$WIKI_DIR"/*.md wiki/

          cd wiki
          git add .

          git -c user.name="forgejo docs" \
              -c user.email="docs@noreply.$SERVER_URL" \
              commit -m "Update generated API documentation" || true

          # En cas d'initialisation locale, ajoute le dépôt distant.
          if ! git remote get-url origin >/dev/null 2>&1; then
            git remote add origin "$WIKI_URL"
          fi

          git -c http.extraheader="$AUTH_HEADER" push -u origin HEAD

      - name: Send notification if wiki cannot be created
        if: always() && steps.pushwiki.outcome == 'failure'
        uses: ./.forgejo/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          bot_avatar_url: 'https://git.greensky.tf/Greensky/assets/raw/commit/94879d525e06a6113741d4918a8414ac015c948a/icons/exclamation.png'
          bot_name: 'Wiki creation failure'
          title: 'Wiki creation has failed'
          title_url: ${{ github.server_url }}/${{ github.repository }}
          description: |
            The [`Wiki`](${{ github.server_url }}/${{ github.repository }}/wiki) creation failed in workflow

            Please [**manually create a page**](${{ github.server_url }}/${{ github.repository }}/wiki?action=_new), then retry this workflow again
          footer_text: 'Forgejo docs'
          footer_icon_url: 'https://git.greensky.tf/Greensky/assets/raw/commit/1745b18f7115e22905923ac5937ccd2d1ab00be0/logos/forgejo/logo.png'
          color: '16711680'

      - name: Send webhook
        uses: ./.forgejo/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Logo from https://www.flaticon.com/free-icons/open-book
          bot_avatar_url: "https://git.greensky.tf/Greensky/assets/raw/commit/1745b18f7115e22905923ac5937ccd2d1ab00be0/icons/wiki-magic.png"
          bot_name: '[DOC] ${{ github.repository }}'
          color: '3447003'
          title: 'Documentation generated'
          title_url: '${{ github.server_url }}/${{ github.repository }}'
          description_file: discord-description.md
          attachment_file: documentation.tar.gz
          attachment_name: documentation.tar.gz
          footer_text: 'Forgejo Actions'
          footer_icon_url: 'https://git.greensky.tf/Greensky/assets/raw/commit/1745b18f7115e22905923ac5937ccd2d1ab00be0/logos/forgejo/logo.png'
